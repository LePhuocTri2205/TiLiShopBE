spring.application.name=TiliShopBE

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TiLiShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Swp@1234x!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.main.allow-circular-references=true

# JWT Configuration
jwt.secret=your_very_long_secret_key_here_make_it_at_least_64_characters_long_for_security_purposes_12345
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
